<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مُغَامَرَة الْمُكَعَّبَات · Block Math</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%235fa83a%22/%3E%3Crect y=%226%22 width=%2216%22 height=%2210%22 fill=%22%238b5a2b%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen 3D world, Minecraft-style RTL HUD pinned to the edges (top bar, tooltip card, answer blocks, XP bar + hotbar). */
:root{
  --sky:#8fd3ff;
  --stone:#8b8b8b; --stone-hi:#c6c6c6; --stone-lo:#565656; --stone-hover:#7d8fd1;
  --ink:#ffffff; --ink-shadow:#3f3f3f; --edge:#000000;
  --tip-bg:rgba(16,0,16,.88); --tip-edge:#2a0a5c; --tip-edge2:#5000a8;
  --xp:#80ff20; --xp-dark:#3a7a10; --gold:#ffe14d; --bad:#ff5555; --good:#55ff55; --yellow:#ffff55; --aqua:#55ffff;
  --panel:rgba(0,0,0,.55);
  --f:'Baloo Bhaijaan 2', 'Geeza Pro', 'Segoe UI', Tahoma, sans-serif;
  --slot:clamp(30px,8.4vw,52px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(0,0,0,.7);--tip-bg:rgba(10,0,12,.92);color-scheme:dark}}
:root[data-theme="dark"]{--panel:rgba(0,0,0,.7);--tip-bg:rgba(10,0,12,.92);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}

/* Minecraft stone button */
.mc{font-family:var(--f);font-weight:800;color:var(--ink);background:var(--stone);border:3px solid var(--edge);border-radius:0;
  box-shadow:inset 3px 3px 0 var(--stone-hi),inset -3px -3px 0 var(--stone-lo);
  text-shadow:2px 2px 0 var(--ink-shadow);cursor:pointer;line-height:1.3;padding:10px 18px;font-size:18px}
.mc:hover{background:var(--stone-hover);box-shadow:inset 3px 3px 0 #a9b9f5,inset -3px -3px 0 #4a5aa0}
.mc:active{transform:translateY(2px)}
.mc:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mc.on{background:#5d9e3a;box-shadow:inset 3px 3px 0 #8fd16a,inset -3px -3px 0 #2f5e1a}

/* HUD top */
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;z-index:5;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
#top>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--edge);box-shadow:inset 2px 2px 0 rgba(255,255,255,.15);
  padding:2px 12px;font-weight:800;font-size:20px;text-shadow:2px 2px 0 #000}
.pill img{width:22px;height:22px;image-rendering:pixelated}
#gemPill.bump{animation:bump .35s}
.spacer{flex:1}
.ib{width:48px;height:48px;padding:0;font-size:22px;display:flex;align-items:center;justify-content:center}
.ib.off{filter:grayscale(1) brightness(.75)}
#btnBuild{width:auto;padding:0 14px;gap:6px;font-size:18px}

/* Tooltip-style question card */
#qcard{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;
  width:max-content;max-width:min(94vw,680px);background:var(--tip-bg);padding:8px 20px 12px;text-align:center;
  border:3px solid var(--tip-bg);box-shadow:inset 0 0 0 3px var(--tip-edge2),inset 0 0 0 5px var(--tip-edge);animation:drop .35s ease-out}
#qtext{font-size:clamp(22px,5.6vw,32px);font-weight:800;line-height:1.75;color:var(--yellow);text-shadow:3px 3px 0 #3f3f15;text-wrap:balance}
#qvis{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;margin-top:4px}
#qvis:empty{display:none}
.irow{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:260px}
.pw{position:relative;display:inline-block;transition:transform .2s}
.pi{width:clamp(26px,6.5vw,38px);height:clamp(26px,6.5vw,38px);image-rendering:pixelated;display:block}
.pw.gone .pi{opacity:.3;filter:grayscale(1)}
.pw.gone::after{content:"";position:absolute;inset:2px;background:linear-gradient(45deg,transparent 44%,var(--bad) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--bad) 44% 56%,transparent 56%)}
.pw.hl{transform:scale(1.35)}
.pw b{position:absolute;top:-12px;left:-8px;font-size:13px;line-height:1;background:var(--gold);color:#000;border:2px solid #000;padding:2px 4px}
.op{font-size:clamp(26px,6vw,36px);font-weight:800;color:#fff;text-shadow:3px 3px 0 #000}
.op.q{color:var(--yellow)}
.tip{font-size:16px;font-weight:700;color:#cfcfcf;line-height:1.8;width:100%}
.bignum{font-size:clamp(46px,13vw,76px);font-weight:800;line-height:1.1;color:#fff;text-shadow:4px 4px 0 #000}
.eq{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;font-size:22px;font-weight:800;color:var(--aqua);text-shadow:2px 2px 0 #000}
.sw{width:34px;height:34px;border:3px solid #000;image-rendering:pixelated;background-size:100% 100%}
.sw.q{background:#555;color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}

/* Answers */
#answers{position:fixed;left:0;right:0;z-index:4;display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,3vw,20px);flex-wrap:wrap;
  bottom:calc(var(--slot) + 54px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#answers>*{pointer-events:auto}
#answers.phys{direction:ltr}
#answers.phys>*{direction:rtl}
.ans{width:clamp(86px,25vw,130px);height:clamp(92px,27vw,138px);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--grass-side,#8b5a2b);background-size:100% 100%;image-rendering:pixelated;border:4px solid #000;border-radius:0;font-family:var(--f);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 6px 0 rgba(0,0,0,.35);cursor:pointer;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.ans:hover{filter:brightness(1.12)}
.ans:active{transform:translateY(3px)}
.ans:focus-visible{outline:4px solid var(--gold)}
.ans .nwd{font-size:clamp(13px,3.6vw,17px);font-weight:800;line-height:1.2;color:#fff;text-shadow:2px 2px 0 #000;white-space:nowrap}
.ans .num{font-size:clamp(34px,9.5vw,56px);font-weight:800;line-height:1;color:#fff;text-shadow:4px 4px 0 #000}
.dots{display:grid;grid-template-columns:repeat(5,9px);gap:3px;padding:4px;background:rgba(0,0,0,.4);direction:rtl}
.dots i{width:9px;height:9px;background:var(--gold);box-shadow:inset -2px -2px 0 #b8900a}
.ans.wrong{filter:grayscale(1) brightness(.55);animation:shake .4s}
.ans.right{outline:5px solid var(--good);animation:winner .7s}
.ans.glow,.mc.glow{animation:glow 1s infinite}
.ans.color .swatch{width:62%;aspect-ratio:1;border:3px solid #000;background-size:100% 100%;image-rendering:pixelated}
.ans.color .cname{font-size:16px;font-weight:800;text-shadow:2px 2px 0 #000;color:#fff}
.fork{min-width:clamp(130px,40vw,220px);padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(15px,4vw,19px);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.fork .em{font-size:38px;text-shadow:none}
.fork .arr{font-size:24px;direction:ltr}
.big{font-size:clamp(17px,4.6vw,22px);padding:14px 22px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;display:flex;align-items:center;gap:10px}
.big img{width:32px;height:32px;image-rendering:pixelated}
.cmp{min-width:clamp(120px,38vw,200px);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.cmp .arr{font-size:22px;direction:ltr}
.cmp .irow .pi{width:20px;height:20px}

/* XP bar + hotbar */
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px}
#xpwrap{position:relative;width:calc(var(--slot) * 10 + 33px);max-width:94vw}
#xpnum{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:18px;font-weight:800;color:var(--xp);text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000}
#xp{height:10px;background:#1a1a1a;border:2px solid #000;position:relative;overflow:hidden}
#xp i{position:absolute;right:0;top:0;bottom:0;width:0;background:linear-gradient(var(--xp),var(--xp-dark));transition:width .6s}
#xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#000 calc(10% - 2px) 10%)}
#hotbar{display:flex;background:rgba(0,0,0,.5);border:3px solid #000;padding:3px;gap:3px;max-width:94vw}
.slot{width:var(--slot);height:var(--slot);background:#8b8b8b;box-shadow:inset 3px 3px 0 #373737,inset -3px -3px 0 #ffffff55;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--slot) * .55);cursor:pointer;position:relative;border:0;padding:0;border-radius:0}
.slot img{width:72%;height:72%;image-rendering:pixelated}
.slot.sel{box-shadow:0 0 0 3px #fff,inset 3px 3px 0 #373737;z-index:1}
.slot.new{animation:glow 1s 3}

/* Toast (advancement) */
#toast{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(72px + env(safe-area-inset-top,0px));z-index:6;display:flex;align-items:center;gap:10px;
  background:#212121;border:3px solid #000;box-shadow:inset 0 0 0 3px #555;padding:8px 14px;font-size:16px;font-weight:700;line-height:1.4;
  transform:translateX(-130%);transition:transform .45s cubic-bezier(.3,1.3,.5,1);max-width:70vw}
#toast.show{transform:none}
#toast .ti{font-size:28px}
#toast .tt{color:var(--yellow);font-weight:800}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#menu{background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.mbox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:660px;width:100%;margin:auto}
.logo{position:relative;font-size:clamp(44px,12vw,86px);font-weight:800;line-height:1.05;color:#ececec;margin:0;
  text-shadow:0 5px 0 #6b6b6b,0 10px 0 #3d3d3d,0 14px 16px rgba(0,0,0,.5)}
.logo small{display:block;font-size:.5em;color:#ffcc44;text-shadow:0 4px 0 #8a5a00,0 8px 10px rgba(0,0,0,.5);margin-top:4px}
.splash{position:absolute;left:-2%;bottom:-30px;font-size:clamp(15px,3.6vw,22px);color:var(--yellow);text-shadow:2px 2px 0 #3f3f15;transform:rotate(14deg);animation:splash .5s ease-in-out infinite alternate;white-space:nowrap}
.lvls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.lvl{flex:1 1 112px;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:17px;padding:10px 8px}
.lvl .le{font-size:34px;text-shadow:none}
.lvl .lr{color:var(--yellow)}
.lvl.sel{box-shadow:inset 3px 3px 0 var(--stone-hi),inset -3px -3px 0 var(--stone-lo),0 0 0 4px #fff}
.play{font-size:clamp(22px,6vw,30px);padding:10px 40px;width:min(100%,420px)}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mrow .mc{font-size:16px}
.note{font-size:15px;font-weight:700;color:#eee;opacity:.92;line-height:1.7;text-shadow:1px 1px 0 #000}
.warn{font-size:15px;font-weight:700;background:#5a1a1a;border:3px solid #000;padding:6px 12px;color:#ffd0d0;max-width:520px}

#reward{background:rgba(0,0,0,.6)}
.rbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.rtitle{font-size:clamp(28px,8vw,44px);font-weight:800;color:var(--yellow);text-shadow:3px 3px 0 #3f3f15}
.rstage{position:relative;width:240px;height:220px;display:flex;align-items:flex-end;justify-content:center}
.rays{position:absolute;inset:-60px;background:repeating-conic-gradient(rgba(255,230,120,.35) 0 10deg,transparent 10deg 20deg);border-radius:50%;opacity:0;transition:opacity .4s;animation:spin 8s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.chest{position:relative;width:150px;height:120px;perspective:500px}
.chest .base{position:absolute;bottom:0;left:0;right:0;height:80px;background:#a0642a;border:4px solid #3b230d;box-shadow:inset 0 0 0 4px #7a4a1c,inset 0 -10px 0 #6b3f15}
.chest .lid{position:absolute;left:0;right:0;bottom:76px;height:40px;background:#b5732f;border:4px solid #3b230d;box-shadow:inset 0 0 0 4px #8a5522;transform-origin:50% 0;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.chest .latch{position:absolute;left:50%;top:-12px;width:18px;height:24px;margin-left:-9px;background:#c6c6c6;border:3px solid #333;z-index:2}
.ritem{position:absolute;left:50%;bottom:70px;font-size:76px;transform:translate(-50%,0) scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1) .25s;z-index:3}
#reward.open .rays{opacity:1}
#reward.open .lid{transform:rotateX(-115deg) translateY(-6px)}
#reward.open .ritem{transform:translate(-50%,-90px) scale(1)}
.rname{font-size:clamp(20px,5.4vw,26px);font-weight:800;color:var(--aqua);text-shadow:2px 2px 0 #000;min-height:1.4em}

.fly{position:fixed;width:30px;height:30px;image-rendering:pixelated;z-index:8;pointer-events:none;transition:transform .8s cubic-bezier(.5,-0.3,.6,1),opacity .8s}

@keyframes pop{from{transform:scale(0) translateY(30px)}to{transform:none}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translateX(-50%);opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes winner{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-5deg)}70%{transform:scale(1.1) rotate(4deg)}100%{transform:scale(1.15)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,225,77,.9)}50%{box-shadow:0 0 0 10px rgba(255,225,77,0);filter:brightness(1.3)}}
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes splash{from{transform:rotate(14deg) scale(1)}to{transform:rotate(14deg) scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
[dir="ltr"] .splash{left:auto;right:-6%;transform:rotate(-14deg)}
[dir="ltr"] #xp i{right:auto;left:0}
[dir="ltr"] .pw b{left:auto;right:-8px}
[dir="ltr"] #toast{left:auto;right:max(12px,env(safe-area-inset-right,0px));transform:translateX(130%)}
[dir="ltr"] #toast.show{transform:none}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media (max-width:480px){.pill{font-size:16px;padding:2px 8px}.ib{width:42px;height:42px}#lvlPill span,#btnBuild span{display:none}#btnBuild{padding:0;width:42px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="hidden">
  <div class="pill" id="gemPill"><img id="gemIcon" alt=""><b id="gemCount">٠</b></div>
  <div class="pill" id="lvlPill">⭐ <span data-t="lvl">الْمُسْتَوَى</span> <b id="lvlNum">١</b></div>
  <div class="spacer"></div>
  <button class="mc ib" id="btnBuild" data-ta="build">🧱 <span data-t="buildBtn">اِبْنِ</span></button>
  <button class="mc ib" id="btnRepeat" data-ta="repeat">🔊</button>
  <button class="mc ib" id="btnMusic" data-ta="music">🎵</button>
  <button class="mc ib" id="btnMenu" data-ta="pause">⏸</button>
</div>

<div id="qcard" class="hidden"><div id="qtext"></div><div id="qvis"></div></div>
<div id="answers"></div>

<div id="bottom" class="hidden">
  <div id="xpwrap"><div id="xpnum">٠</div><div id="xp"><i></i></div></div>
  <div id="hotbar"></div>
</div>

<div id="toast"><span class="ti"></span><span><span class="tt"></span><br><span class="td"></span></span></div>

<div id="menu" class="overlay">
  <div class="mbox">
    <h1 class="logo"><span data-t="logo1">رِيَاضِيَّات</span><small data-t="logo2">مُغَامَرَة الْمُكَعَّبَات</small><span class="splash" id="splash"></span></h1>
    <div class="lvls" id="lvls"></div>
    <div class="mrow" id="kidRow"></div>
    <button class="mc play" id="btnPlay">اِلْعَبْ</button>
    <div class="mrow">
      <!-- back to the Paint Studio home screen -->
      <button class="mc" id="btnHome" aria-label="الرَّئِيسِيَّة" onclick="location.href='../index.html'">🏠</button>
      <button class="mc" id="btnLang">🌐 English</button>
      <button class="mc" id="btnVoiceSel">🎙️</button>
      <button class="mc" id="btnVoice">🔊 الصَّوْت</button>
      <button class="mc" id="btnDigits">الْأَرْقَام</button>
      <button class="mc" id="btnNew">عَالَم جَدِيد</button>
    </div>
    <div class="warn hidden" id="voiceNote" data-t="voiceNote"></div>
    <div class="note" data-t="note"></div>
  </div>
</div>

<div id="reward" class="overlay hidden">
  <div class="rbox">
    <div class="rtitle" data-t="treasure">كَنْز!</div>
    <div class="rstage"><div class="rays"></div><div class="chest"><div class="lid"><div class="latch"></div></div><div class="base"></div></div><div class="ritem" id="ritem"></div></div>
    <div class="rname" id="rname"></div>
    <button class="mc play" id="rbtn" data-t="rbtn">رَائِع! هَيَّا نُكْمِلْ</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wait=s=>new Promise(r=>setTimeout(r,s*1000));
const lerpAngle=(a,b,t)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t};
function hash(x,z,s=0){let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,z,sc,s){const X=Math.floor(x/sc),Z=Math.floor(z/sc),fx=x/sc-X,fz=z/sc-Z;const u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const a=hash(X,Z,s),b=hash(X+1,Z,s),c=hash(X,Z+1,s),d=hash(X+1,Z+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)*f|0,0,255),g=clamp((n>>8&255)*f|0,0,255),b=clamp((n&255)*f|0,0,255);return `rgb(${r},${g},${b})`}
const V3=THREE.Vector3;
const FONT='"Baloo Bhaijaan 2", "Geeza Pro", Tahoma, sans-serif';

  const treeCells=new Set();

    for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)if(treeCells.has(K(x+dx,z+dz)))return;treeCells.add(K(x,z));

      put(lv,x,th+2,z);put(lv,x+1,th+2,z);put(lv,x-1,th+2,z);put(lv,x,th+2,z+1);put(lv,x,th+2,z-1)}
    else if(type==='spruce'){const th=randi(5,7);for(let y=1;y<=th;y++)put('log',x,y,z);
      for(let y=3;y<=th+1;y++){const i=th+1-y,rad=i===0?0:(i%2===1?1:2);for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){if(dx===0&&dz===0&&y<=th)continue;if(rad===2&&Math.abs(dx)===2&&Math.abs(dz)===2)continue;put('spruce',x+dx,y,z+dz)}}
      put('spruce',x,th+2,z)}
    else if(type==='palm'){const th=randi(3,4);for(let y=1;y<=th;y++)put('log',x,y,z);put('leaves',x,th+1,z);
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{put('leaves',x+a,th+1,z+b);put('leaves',x+a*2,th,z+b*2)})}

      if(!allPath.has(k)&&!calm&&!nearPath(x,z,2)){const v=vnoise(x,z,6,seedH+5);if(v>0.62)h=v>0.75?2:1}

  }
  for(const type in inst){const a=inst[type],n=a.length/3,def=BLOCKS[type];const m=new THREE.InstancedMesh(def.geo,def.mat,n);

/* ---------- challenge planning (procedural = endless) ---------- */
let lastTypes=[];
function numberOptions(ans,min,max,k=3){const s=new Set([ans]);let n=0;while(s.size<k&&n++<60){const v=ans+pick([-2,-1,1,2,1,-1,3]);if(v>=min&&v<=max)s.add(v)}let v=min;while(s.size<k){s.add(v);v++}return [...s].sort((a,b)=>a-b)}
function distinct(k,lo,hi){const s=new Set();while(s.size<k)s.add(randi(lo,hi));return [...s]}
const LVL_RANGE={1:{max:5,hi:5},2:{max:10,hi:10},3:{max:10,hi:20},4:{max:15,hi:30},5:{max:20,hi:50}};
function planChallenge(seg){const L=S.level;
  const sea=!!BIOMES[seg.biome].sea;let base;
  if(sea){base=['fishing','fishJump','fishColor','fishing','fishJump','fishColor','add','find','bigger','missing','order','pattern','colorFind','oddOne','dice','makeTen','jump','shop','scale'];if(L>=2)base.push('sub','colorMix');if(L>=3)base.push('groups')}
  else{base=['count','add','find','compare','bridge','mine','pattern','tower','feed','missing','order','dice','bigger','count','add','colorFind','colorCount','oddOne','memory','scale','shop','makeTen','jump'];if(L>=3)base.push('groups','groups');if(L>=2)base.push('sub','sub','share','colorMix');if(L>=4)base.push('missing','sub','oddOne');}
  const pool=base.filter(t=>!lastTypes.includes(t));const type=pick(pool);lastTypes.push(type);if(lastTypes.length>7)lastTypes.shift();
  const LV=LVL_RANGE[L]||LVL_RANGE[5],max=LV.max,hi=LV.hi;const ch={type,seg,tries:0,L};
  switch(type){
    case 'count':ch.n=randi(L===1?1:3,L===1?5:(L===2?8:10));ch.animal=pick(Object.keys(ANIMALS));break;
    case 'add':ch.a=randi(1,max-1);ch.b=randi(1,Math.min(max-ch.a,L===1?3:5));ch.item=pick(FOOD);break;
    case 'sub':ch.n=randi(3,L===2?6:10);ch.m=randi(1,Math.min(ch.n-1,L===2?3:5));ch.item=pick(FOOD);break;
    case 'find':ch.target=randi(1,hi);ch.opts=shuffle(numberOptions(ch.target,1,hi,L===1?3:4));break;
    case 'compare':ch.more=L===1?true:Math.random()<0.6;do{ch.a=randi(1,max);ch.b=randi(1,max)}while(Math.abs(ch.a-ch.b)<(L===1?2:1));ch.item=pick(['diamond','emerald','gold']);break;
    case 'bridge':ch.n=randi(2,L===1?4:(L===2?6:8));break;
    case 'mine':ch.n=randi(1,L===1?5:8);ch.ore=pick(['gold','diamond']);break;
    case 'tower':ch.n=randi(L===1?2:3,L===1?5:(L===2?8:10));break;
    case 'feed':ch.n=randi(2,L===1?4:6);ch.animal=pick(Object.keys(ANIMALS));break;
    case 'missing':{const len=L===1?4:5;const step=L>=4?pick([2,2,5,10,1]):1;ch.step=step;ch.start=randi(1,Math.max(1,Math.floor(hi/step)-len+1));
      ch.seqN=Array.from({length:len},(_,i)=>(ch.start+i)*step);ch.gap=randi(L===1?1:0,len-1);ch.ans=ch.seqN[ch.gap];break}
    case 'fishing':ch.n=randi(2,L===1?5:(L===2?8:10));ch.extra=randi(2,4);break;
    case 'fishJump':ch.n=randi(2,L===1?5:(L===2?7:9));ch.col=pick(['orange','yellow','pink']);break;
    case 'fishColor':{const cols=shuffle(['orange','blue','yellow','pink','green']).slice(0,L===1?2:3);ch.col=cols[0];ch.n=randi(1,L===1?4:7);
      ch.list=shuffle([...Array(ch.n).fill(cols[0]),...Array.from({length:randi(2,L===1?3:5)},()=>pick(cols.slice(1)))]);break}
    case 'scale':ch.a=randi(2,L===1?5:8);ch.b=randi(L===1?1:0,ch.a-1);break;
    case 'shop':ch.price=randi(1,L===1?5:(L===2?8:10));ch.item=pick(FOOD);break;
    case 'makeTen':ch.T=L===1?5:10;ch.f=randi(1,ch.T-1);break;
    case 'jump':{const top=L===1?5:10;ch.top=top;ch.back=L>=2&&Math.random()<0.35;ch.b=randi(1,L===1?3:4);ch.a=ch.back?randi(ch.b,top):randi(0,top-ch.b);ch.ans=ch.back?ch.a-ch.b:ch.a+ch.b;break}
    case 'groups':ch.g=randi(2,L>=5?4:3);ch.k=randi(1,L>=5?5:3);ch.item=pick(FOOD);break;
    case 'colorFind':ch.cols=shuffle(Object.keys(WOOL)).slice(0,L===1?3:4);ch.target=pick(ch.cols);break;
    case 'colorCount':{const cols=shuffle(Object.keys(WOOL)).slice(0,L===1?2:3);ch.col=cols[0];ch.n=randi(1,L===1?4:7);
      ch.list=shuffle([...Array(ch.n).fill(cols[0]),...Array.from({length:randi(2,L===1?3:5)},()=>pick(cols.slice(1)))]);break}
    case 'colorMix':{const mx=pick([['red','yellow','orange'],['blue','yellow','green'],['red','blue','purple']]);ch.mix=mx;ch.answer=mx[2];
      ch.opts=shuffle([mx[2],...shuffle(['orange','green','purple','pink'].filter(c=>c!==mx[2])).slice(0,2)]);break}
    case 'oddOne':{ch.kind=(L===1||Math.random()<0.5)?'item':'color';ch.n=L===1?3:4;ch.odd=randi(0,ch.n-1);
      const pair=shuffle(ch.kind==='item'?[...FOOD,'diamond','gold']:Object.keys(WOOL)).slice(0,2);ch.a=pair[0];ch.b=pair[1];break}
    case 'memory':ch.list=shuffle(Object.keys(ANIMALS)).slice(0,L===1?3:4);ch.gone=randi(0,ch.list.length-1);break;
    case 'order':ch.nums=distinct(L===1?3:(L===2?4:5),1,hi);ch.sorted=[...ch.nums].sort((a,b)=>a-b);break;
    case 'dice':ch.n=randi(1,L===1?4:6);ch.n2=L===3?randi(1,4):0;break;
    case 'bigger':ch.big=L===1?true:Math.random()<0.6;ch.nums=distinct(L===1?2:3,1,hi);ch.target=ch.big?Math.max(...ch.nums):Math.min(...ch.nums);break;
    case 'share':ch.k=randi(1,L===2?3:5);break;
    case 'pattern':{const kinds=L===1?['AB']:['AB','AAB','ABB','ABC'];const kind=pick(kinds);const cols=shuffle(Object.keys(WOOL));
      const unit=[...kind].map(c=>cols[c.charCodeAt(0)-65]);const show=unit.length===2?5:6;ch.seq=[];for(let i=0;i<show;i++)ch.seq.push(unit[i%unit.length]);
      ch.answer=unit[show%unit.length];const others=cols.filter(c=>c!==ch.answer);
      ch.opts=shuffle([ch.answer,...others.filter(c=>unit.includes(c)).slice(0,1),...others.filter(c=>!unit.includes(c))].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3));break}
  }
  return ch}

/* ---------- challenge 3D objects ---------- */
// Arabic reads right-to-left: rows of things run from the player's right (s>0) to left.
const rtlS=(i,n,sp)=>(isAR()?1:-1)*((n-1)/2-i)*sp;
function itemGrid(seg,key,n,t,s,y0=2.0){const cols=n<=3?n:(n<=6?3:(n<=8?4:5)),rows=Math.ceil(n/cols),sp=0.62,out=[];

function numCanvas(n){return mk(64,64,g=>{g.fillStyle='#ece5d3';g.fillRect(0,0,64,64);for(let i=0;i<90;i++)px(g,pick(['#e2dac6','#f4efe2','#d8cfb8']),randi(0,63),randi(0,63));

function tapCountable(ch,o){o.userData.hop=1;sfx.hop();P.swing=1;

function animalUpdate(o,dt,time){const u=o.userData;u.timer-=dt;

/* ---------- challenge flow ---------- */
// Speak the full instructions the first time a puzzle type appears; afterwards only the short question.
const FULL_ALWAYS=new Set(['missing','pattern','add','jump','makeTen','groups','colorMix','sub']);
const TITLE_SHORT=new Set(['scale','mine','bridge','feed','order','share']);
const stripEmoji=t=>t.replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,'').trim();
function shortPrompt(ch){if(FULL_ALWAYS.has(ch.type))return ch.prompt;if(TITLE_SHORT.has(ch.type))return stripEmoji(qtext.textContent);
  const q=ch.prompt.match(/^[^؟?]*[؟?]/);if(q)return q[0];const f=ch.prompt.match(/^[^.!]*[.!]/);return f?f[0]:ch.prompt}
function firstTime(key){S.seen=S.seen||{};if(S.seen[key])return false;S.seen[key]=1;save();return true}
const sayPrompt=(ch,o)=>say(firstTime(ch.type)?ch.prompt:shortPrompt(ch),o);
const PRAISE=()=>tr(['رَائِع!',G('أَحْسَنْتَ!','أَحْسَنْتِ!'),`${G('مُمْتَاز','مُمْتَازَة')} ${ya()}!`,'عَمَل عَظِيم!','وَاو، مُذْهِل!','نَعَمْ! إِجَابَة صَحِيحَة!',G('أَنْتَ ذَكِيّ جِدًّا!','أَنْتِ ذَكِيَّة جِدًّا!'),G('أَنْتَ بَطَل الرِّيَاضِيَّات!','أَنْتِ بَطَلَة الرِّيَاضِيَّات!'),`${G('أَحْسَنْتَ','أَحْسَنْتِ')} ${ya()}!`,`رَائِع ${ya()}!`],
  ['Awesome!','You did it!','Super smart!','Great job!','Wow, amazing!','Yes! That is right!','Brilliant!','You are a math master!',`Great job, ${ya()}!`,`Awesome, ${ya()}!`]);
const praise=()=>pick(PRAISE());
const OOPS=()=>tr([`أُوه! ${G('حَاوِلْ','حَاوِلِي')} مَرَّة أُخْرَى!`,`قَرِيب جِدًّا! ${G('حَاوِلْ','حَاوِلِي')} مُجَدَّدًا!`,`لَيْسَ تَمَامًا. ${G('أَنْتَ تَسْتَطِيع','أَنْتِ تَسْتَطِيعِينَ')}!`],['Oops! Try again!','Almost! Try again!','Not quite. You can do it!']);
const tap=()=>tr(G('الْمِسْ','الْمِسِي'),'Tap');
function startChallenge(){const ch=P.seg.challenge;P.state='challenge';ch.active=true;ch.counter=0;ch.tries=0;$('#btnBuild').disabled=true;H[ch.type](ch)}
async function correct(ch,btn){if(ch.done)return;ch.done=true;ch.active=false;
  if(btn)btn.classList.add('right');
  sfx.correct();P.celebrate=1.4;P.jumpV=6;const hp=hero.g.position.clone();hp.y+=2;burst(hp,CONF,28,5);
  say(praise());
  S.emeralds+=3;flyGems(3);S.solved++;
  if(ch.tries===0){S.streak++;S.struggle=0;if(S.streak>=6&&S.level<5){S.level++;S.streak=0;setTimeout(()=>{toast('⭐',tr('مُسْتَوًى جَدِيد!','Level up!'),LEVELS[S.level].name());sfx.chest();
      say(levelUpSay(S.level),{keep:true})},1800)}}
  else{S.streak=0;if(ch.tries>=2){S.struggle++;if(S.struggle>=3&&S.level>1){S.level--;S.struggle=0}}}
  save();setTimeout(updateHUD,700);
  await wait(1.7);hideQ();clearAnswers();clearLabels();
  if(ch.cleanup)await ch.cleanup();
  if(ch.animals&&ch.type==='count')ch.animals.forEach(a=>a.userData.calm=false);
  if(S.solved%4===0)await showReward();
  P.seg.challengeDone=true;P.state='walk';$('#btnBuild').disabled=false}
function wrong(ch,btn,msg){ch.tries++;sfx.wrong();
  if(btn){btn.classList.add('wrong');btn.disabled=true}
  const m=msg||pick(OOPS());
  if(ch.tries===1&&ch.hint)say(m+(ch.hintSay!=null?ch.hintSay:tr(' لِنَعُدَّ مَعًا!'," Let's count together!"))).then(()=>{if(!ch.done)ch.hint()});else say(m);
  if(ch.tries>=2){answers.querySelectorAll('[data-ok="1"]').forEach(b=>b.classList.add('glow'));if(ch.glow)ch.glow()}}
async function countAlong(ch,objs,from=0,clear=true){if(ch.counting)return;ch.counting=true;if(clear)clearLabels();
  for(let i=0;i<objs.length;i++){if(ch.done)break;const o=objs[i];o.userData.counted=from+i+1;addLabel(o,from+i+1);o.userData.hop=1;sfx.pop(i);await sayN(from+i+1)}
  ch.counter=from+objs.length;ch.counting=false}
async function countIcons(ch,sel){if(ch.counting)return;ch.counting=true;const els=[...qvis.querySelectorAll(sel)];
  for(let i=0;i<els.length;i++){if(ch.done)break;els[i].classList.add('hl');const b=document.createElement('b');b.textContent=num(i+1);els[i].appendChild(b);sfx.pop(i);await sayN(i+1);els[i].classList.remove('hl')}
  ch.counting=false}

const P={seg:null,t:0,v:0,state:'menu',yaw:Math.PI,camYaw:Math.PI,jumpY:0,jumpV:0,phase:0,celebrate:0,swing:0,prev:null,buildOrbit:0};

function updatePlayer(dt,time){const seg=P.seg;
  if(P.state==='walk'){const stop=seg.challengeDone?seg.len:seg.st;const remain=stop-P.t;const target=Math.min(3.4,Math.max(0.8,remain*1.3));
    P.v+=(target-P.v)*Math.min(1,dt*2.5);P.t+=P.v*dt;
    if(P.t>=stop){P.t=stop;P.v=0;if(!seg.challengeDone)startChallenge();else startFork()}}
  else P.v*=Math.max(0,1-dt*8);
  const pos=seg.at(P.t,0,0.5);

  if(atSea){boat.position.set(pos.x,0.16+bob,pos.z);boat.rotation.y=P.yaw;boat.rotation.z=Math.sin(time*1.7)*0.04;boat.userData.oar.rotation.y=Math.sin(P.phase*1.2)*0.5*w;
    if(P.v>0.5&&Math.random()<dt*8)burst(new V3(pos.x-Math.sin(P.yaw)*1.1,0.45,pos.z-Math.cos(P.yaw)*1.1),['#cfe9ff','#ffffff'],3,1.2)}
  hero.g.position.set(pos.x,(atSea?0.24+bob:0.5+Math.abs(Math.sin(P.phase))*0.06*w)+P.jumpY,pos.z);
  const ty=Math.atan2(seg.f.x,seg.f.z)+(P.state==='build'?P.buildOrbit:0);P.yaw=lerpAngle(P.yaw,ty,1-Math.exp(-dt*6));P.camYaw=lerpAngle(P.camYaw,ty,1-Math.exp(-dt*(P.state==='build'?8:2.2)));
  hero.g.rotation.y=P.yaw;
  const sw=atSea?0:Math.sin(P.phase)*0.75*w;hero.legL.rotation.x=sw;hero.legR.rotation.x=-sw;
  P.celebrate=Math.max(0,P.celebrate-dt);P.swing=Math.max(0,P.swing-dt*3.5);
  if(P.celebrate>0){const a=-2.8+Math.sin(time*14)*0.3;hero.armL.rotation.x=a;hero.armR.rotation.x=a;hero.armL.rotation.z=-0.3;hero.armR.rotation.z=0.3}
  else{hero.armL.rotation.z=0;hero.armR.rotation.z=0;hero.armL.rotation.x=-sw*0.8+Math.sin(time*2)*0.04;
    hero.armR.rotation.x=P.swing>0?-1.9*Math.sin(P.swing*Math.PI):((S.held||hero.pickaxe.visible||hero.handBlock.visible)?-0.35:0)+sw*0.8-Math.sin(time*2)*0.04}
  hero.head.rotation.y=P.state==='fork'?Math.sin(time*1.2)*0.5:0;
  hero.cape.rotation.x=0.12+w*0.35+Math.sin(time*5)*0.04*w;
  const fwd=new V3(Math.sin(P.yaw),0,Math.cos(P.yaw)),right=new V3(-fwd.z,0,fwd.x);
  pets.forEach((p,i)=>{p.o.visible=!atSea;const tgt=hero.g.position.clone().addScaledVector(fwd,-1.4-i*0.4).addScaledVector(right,p.side*1.1);tgt.y=0.5;
    const d=tgt.clone().sub(p.o.position);d.y=0;const dist=d.length();const moving=dist>0.15;
    if(dist>12)p.o.position.copy(tgt);else if(moving){p.o.position.addScaledVector(d.normalize(),Math.min(dist,dt*Math.min(7,dist*3+1)));p.o.rotation.y=lerpAngle(p.o.rotation.y,Math.atan2(d.x,d.z),Math.min(1,dt*6))}
    else p.o.rotation.y=lerpAngle(p.o.rotation.y,P.yaw,dt*3);
    p.ph+=dt*(moving?12:0);const s2=moving?Math.sin(p.ph)*0.7:0;p.o.userData.legs.forEach((l,j)=>l.rotation.x=(j===0||j===3)?s2:-s2);
    p.o.position.y=0.5+(P.celebrate>0?Math.abs(Math.sin(time*10))*0.4:0);p.o.userData.tail.rotation.y=Math.sin(time*(moving?14:6))*0.5});
  for(const g of seg.gems){if(g.userData.got)continue;g.rotation.y+=dt*2.5;g.position.y=1.25+Math.sin(time*3+g.userData.ph)*0.12;
    const dx=g.position.x-pos.x,dz=g.position.z-pos.z;if(dx*dx+dz*dz<1.1){g.userData.got=true;sfx.coin();S.emeralds++;updateHUD();bumpGem();

/* ---------- input (tap vs drag) ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{initAudio();down={x:e.clientX,y:e.clientY,lx:e.clientX}});
canvas.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.lx;down.lx=e.clientX;
  if(P.state==='build'&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>10)P.buildOrbit-=dx*0.008});
canvas.addEventListener('pointerup',e=>{const d=down;down=null;if(!d||Math.hypot(e.clientX-d.x,e.clientY-d.y)>12)return;handleTap(e.clientX,e.clientY)});
canvas.addEventListener('pointercancel',()=>{down=null});
function handleTap(cx,cy){if(P.state==='menu'||P.state==='paused')return;
  if(P.state==='build'){buildTap(cx,cy);return}
  ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const list=[...tappables].filter(o=>o.parent&&o.visible!==false);let target=null;
  for(const h of ray.intersectObjects(list,true)){let o=h.object;while(o&&!o.userData.tap)o=o.parent;if(o){target=o;break}}
  if(!target){let best=64;const v=new V3();for(const o of list){o.getWorldPosition(v);v.y+=0.4;v.project(camera);if(v.z>1)continue;
    const d=Math.hypot((v.x+1)/2*innerWidth-cx,(1-v.y)/2*innerHeight-cy);if(d<best){best=d;target=o}}}
  if(target)target.userData.tap(target)}

let last=performance.now(),time=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(tw.e(k));if(k>=1){tweens.splice(i,1);tw.res()}}
  if(P.seg)updatePlayer(dt,time);
  updaters.forEach(o=>o.userData.update(o,dt,time));
  for(let i=parts.length-1;i>=0;i--){const p=parts[i],u=p.userData;u.v.y-=16*dt;p.position.addScaledVector(u.v,dt);if(p.position.y<0.57){p.position.y=0.57;u.v.y*=-0.35;u.v.x*=0.7;u.v.z*=0.7}
    u.life-=dt;p.scale.setScalar(Math.max(0.01,u.life/u.max));if(u.life<=0){scene.remove(p);parts.splice(i,1)}}
  const lv=new V3();labels.forEach(l=>{l.o.getWorldPosition(lv);l.s.position.set(lv.x,lv.y+l.off,lv.z)});
  T.water.offset.x=(time*0.04)%1;T.water.offset.y=(time*0.025)%1;
  const hp=hero.g.position;clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x-hp.x>95)c.position.x-=190;if(c.position.x-hp.x<-95)c.position.x+=190;if(c.position.z-hp.z>95)c.position.z-=190;if(c.position.z-hp.z<-95)c.position.z+=190});
  skyCol.lerp(skyTarget,Math.min(1,dt*1.5));scene.fog.color.copy(skyCol);
  renderer.render(scene,camera);requestAnimationFrame(loop)}
