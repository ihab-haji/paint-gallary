<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#2e7d35">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>قرود مشاغبة · Monkey Mischief</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐒</text></svg>">
	<link rel="stylesheet" href="mm.css">
</head>
<body class="at-start">
	<!-- the Phaser jungle: always running (the monkeys play by themselves behind the menus) -->
	<div id="stage" aria-label="Jungle"></div>

	<header class="topbar" id="topbar">
		<button class="round-btn" id="homeBtn" type="button" aria-label="Home">🏠</button>
		<span class="spacer"></span>
		<button class="round-btn" id="langBtn" type="button" aria-label="Language">🌐</button>
		<button class="round-btn" id="voiceBtn" type="button" aria-label="Voice">🗣️</button>
		<button class="round-btn" id="musicBtn" type="button" aria-label="Music">🎵</button>
		<button class="round-btn" id="soundBtn" type="button" aria-label="Sound">🔊</button>
	</header>

	<!-- ============ START ============ -->
	<main class="screen active" id="start">
		<div class="title-wrap">
			<div class="troop" id="troop" aria-hidden="true"></div>
			<h1 class="title" data-t="title"></h1>
			<p class="tagline" data-t="tagline"></p>
			<button class="big-btn" id="playBtn" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
				<span data-t="play"></span>
			</button>
		</div>
	</main>

	<!-- ============ SETUP: who plays, how they move, how long ============ -->
	<main class="screen" id="setup">
		<div class="setup-card">
			<section id="players" aria-label="Players"></section>
			<div class="opt">
				<span class="opt-label" data-t="controls"></span>
				<div class="seg" id="modeSeg" role="radiogroup">
					<button type="button" class="seg-btn" data-mode="joy" role="radio">
						<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" class="o"/><circle cx="29" cy="19" r="8" class="f"/><path d="M24 7v4M24 37v4M7 24h4M37 24h4" class="o"/></svg>
						<span data-t="joy"></span>
					</button>
					<button type="button" class="seg-btn" data-mode="finger" role="radio">
						<svg viewBox="0 0 48 48" aria-hidden="true"><path class="f" d="M19 26V10.5a3.5 3.5 0 0 1 7 0V22l9.2 2.3a4 4 0 0 1 3 4.6L37 37a6 6 0 0 1-5.9 5H24a6 6 0 0 1-4.8-2.4l-6.4-8.5a3 3 0 0 1 4.4-4z"/><circle cx="22.5" cy="10" r="7.5" class="o"/></svg>
						<span data-t="finger"></span>
					</button>
				</div>
			</div>
			<div class="opt">
				<span class="opt-label" data-t="length"></span>
				<div class="seg small" id="lenSeg" role="radiogroup">
					<button type="button" class="seg-btn" data-len="120" role="radio"><span data-t="short"></span></button>
					<button type="button" class="seg-btn" data-len="180" role="radio"><span data-t="long"></span></button>
				</div>
			</div>
			<button class="big-btn" id="goBtn" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
				<span data-t="play"></span>
			</button>
		</div>
	</main>

	<!-- ============ IN GAME ============ -->
	<div class="side" id="side">
		<button class="round-btn" id="pauseBtn" type="button" aria-label="Pause">
			<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/></svg>
		</button>
		<button class="pill-btn" id="startNowBtn" type="button"><span data-t="startNow"></span></button>
	</div>

	<!-- ============ PAUSE ============ -->
	<div class="overlay hidden" id="pauseOverlay" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
		<div class="card pause-card">
			<h2 id="pauseTitle" data-t="pause"></h2>
			<button class="big-btn" id="resumeBtn" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
				<span data-t="resume"></span>
			</button>
			<div class="row">
				<button class="pill-btn" id="restartBtn" type="button"><span>🔁</span><span data-t="restart"></span></button>
				<button class="pill-btn" id="menuBtn" type="button"><span>👥</span><span data-t="home"></span></button>
			</div>
		</div>
	</div>

	<!-- ============ RESULTS ============ -->
	<div class="overlay hidden" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
		<div class="card result-card">
			<div class="rays" aria-hidden="true"></div>
			<h2 id="resultTitle"></h2>
			<ol class="podium" id="podium"></ol>
			<div class="row">
				<button class="big-btn" id="againBtn" type="button"><span>🔁</span><span data-t="again"></span></button>
				<button class="pill-btn" id="resultMenuBtn" type="button"><span>👥</span><span data-t="home"></span></button>
			</div>
		</div>
	</div>

	<script src="../assets/vendor/phaser.min.js"></script>
	<script src="../assets/vendor/confetti.js"></script>
	<script src="../assets/players/heroes.js"></script>
	<script src="../assets/players/players.js"></script>
	<script src="words.js"></script>
	<script src="audio/ar/index.js"></script>
	<script src="audio/en/index.js"></script>
	<script src="js/sound.js"></script>
	<script src="js/art.js"></script>
	<script src="js/layout.js"></script>
	<script src="js/fx.js"></script>
	<script src="js/input.js"></script>
	<script src="js/monkey.js"></script>
	<script src="js/bananas.js"></script>
	<script src="js/baskets.js"></script>
	<script src="js/traps.js"></script>
	<script src="js/powerups.js"></script>
	<script src="js/gorilla.js"></script>
	<script src="js/bot.js"></script>
	<script src="js/director.js"></script>
	<script src="js/hud.js"></script>
	<script src="js/scene.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
