<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset=".55" stop-color="#fce7f3"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
		<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
		<radialGradient id="top" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ddd6fe"/></radialGradient>
		<radialGradient id="ball" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#fffbe0"/><stop offset=".35" stop-color="#ffd84a"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient>
		<linearGradient id="coral" x1="0" x2="1"><stop offset="0" stop-color="#e03e52"/><stop offset=".28" stop-color="#ff6b6b"/><stop offset=".42" stop-color="#ffc2c2"/><stop offset=".58" stop-color="#ff6b6b"/><stop offset="1" stop-color="#e03e52"/></linearGradient>
		<linearGradient id="sky" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset=".28" stop-color="#4d96ff"/><stop offset=".42" stop-color="#b8d4ff"/><stop offset=".58" stop-color="#4d96ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
		<linearGradient id="mint" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset=".28" stop-color="#34d399"/><stop offset=".42" stop-color="#b4f5dc"/><stop offset=".58" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
		<path id="body" d="M16 134 C20 100 26 52 30 28 Q32 15 46 14 L74 14 Q88 15 90 28 C94 52 100 100 104 134 Z"/>
		<g id="trim">
			<path d="M21 104 Q60 114 99 104 L100.5 113 Q60 124 19.5 113 Z" fill="#fff" opacity=".85"/>
			<path d="M39 30 Q35 70 29 120" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round" fill="none"/>
			<circle cx="44" cy="24" r="3" fill="#fff" opacity=".8"/>
		</g>
	</defs>
	<rect width="800" height="600" fill="url(#bg)"/>
	<!-- soft color blobs -->
	<g filter="url(#blur)" opacity=".7">
		<circle cx="120" cy="90" r="170" fill="#c4b5fd"/>
		<circle cx="700" cy="140" r="150" fill="#f9a8d4"/>
		<circle cx="640" cy="560" r="150" fill="#fde68a"/>
		<circle cx="160" cy="560" r="140" fill="#93c5fd"/>
	</g>
	<!-- sparkles -->
	<g fill="#fff">
		<path d="M150 150 l7 19 19 7 -19 7 -7 19 -7 -19 -19 -7 19 -7Z"/>
		<path d="M640 110 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5Z"/>
		<path d="M560 230 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4Z"/>
	</g>
	<!-- floating pedestal -->
	<ellipse cx="400" cy="540" rx="330" ry="40" fill="#7c3aed" opacity=".18"/>
	<ellipse cx="400" cy="508" rx="320" ry="58" fill="#7c3aed"/>
	<ellipse cx="400" cy="500" rx="320" ry="58" fill="#a78bfa"/>
	<ellipse cx="400" cy="490" rx="320" ry="58" fill="url(#top)"/>
	<ellipse cx="400" cy="490" rx="276" ry="42" fill="none" stroke="#8b5cf6" stroke-opacity=".22" stroke-width="3"/>
	<!-- shadows -->
	<g fill="#4c1d95" opacity=".22"><ellipse cx="200" cy="492" rx="62" ry="12"/><ellipse cx="400" cy="494" rx="44" ry="9"/><ellipse cx="600" cy="492" rx="62" ry="12"/></g>
	<!-- coral and mint cups down -->
	<g transform="translate(131 322) scale(1.15)"><use href="#body" fill="url(#coral)"/><path d="M16 134 Q60 148 104 134 L104 138 Q60 153 16 138 Z" fill="#e03e52"/><use href="#trim"/></g>
	<g transform="translate(531 322) scale(1.15)"><use href="#body" fill="url(#mint)"/><path d="M16 134 Q60 148 104 134 L104 138 Q60 153 16 138 Z" fill="#059669"/><use href="#trim"/></g>
	<!-- the ball -->
	<g transform="translate(400 442)">
		<circle r="48" fill="url(#ball)"/>
		<path d="M-42 8 Q0 26 42 8" stroke="#ff6b8b" stroke-width="7" fill="none" opacity=".75"/>
		<ellipse cx="-14" cy="-6" rx="6" ry="8" fill="#3a2152"/><ellipse cx="14" cy="-6" rx="6" ry="8" fill="#3a2152"/>
		<circle cx="-12" cy="-9" r="2.3" fill="#fff"/><circle cx="16" cy="-9" r="2.3" fill="#fff"/>
		<path d="M-11 9 Q0 20 11 9" stroke="#3a2152" stroke-width="4" fill="none" stroke-linecap="round"/>
		<ellipse cx="-27" cy="6" rx="7" ry="4" fill="#ff7aa8" opacity=".55"/><ellipse cx="27" cy="6" rx="7" ry="4" fill="#ff7aa8" opacity=".55"/>
		<ellipse cx="-18" cy="-28" rx="12" ry="6" fill="#fff" opacity=".75" transform="rotate(-28 -18 -28)"/>
	</g>
	<!-- the blue cup lifted -->
	<g transform="translate(331 150) rotate(-8 69 86) scale(1.15)"><use href="#body" fill="url(#sky)"/><path d="M16 134 Q60 148 104 134 L104 138 Q60 153 16 138 Z" fill="#2563eb"/><use href="#trim"/></g>
	<g stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" opacity=".45"><path d="M322 345 v22"/><path d="M478 345 v22"/></g>
</svg>
