<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
	<!-- Monkey Mischief cover: two mischievous monkeys, a banana tower and a slippery peel in a bright jungle clearing -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0a0"/><stop offset=".6" stop-color="#86d861"/><stop offset="1" stop-color="#5fbf4a"/></linearGradient>
		<radialGradient id="fur" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#b47a45"/><stop offset="1" stop-color="#8a5a33"/></radialGradient>
		<linearGradient id="ban" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff27a"/><stop offset=".5" stop-color="#ffd84a"/><stop offset="1" stop-color="#f2b318"/></linearGradient>
		<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
		<path id="banana" d="M-17 -9Q-4 14 18 2Q21 0 19 -3Q-2 5 -12 -13Z" fill="url(#ban)" stroke="#3b2416" stroke-width="2.6" stroke-linejoin="round"/>
		<g id="leaf"><path d="M0 0Q50 -26 100 0Q50 26 0 0Z" stroke="#3b2416" stroke-width="4" stroke-linejoin="round"/><path d="M8 0H92" stroke="#1d6b34" stroke-width="2.5"/></g>
		<!-- one monkey, 120 x 140 units, feet at the bottom -->
		<g id="monkey">
			<path d="M80 112C112 112 112 78 98 76C88 75 88 88 97 88" fill="none" stroke="#3b2416" stroke-width="10" stroke-linecap="round"/>
			<path d="M80 112C112 112 112 78 98 76C88 75 88 88 97 88" fill="none" stroke="#8a5a33" stroke-width="5.5" stroke-linecap="round"/>
			<ellipse cx="45" cy="131" rx="12" ry="7" fill="#e9b97a" stroke="#3b2416" stroke-width="3"/>
			<ellipse cx="75" cy="131" rx="12" ry="7" fill="#e9b97a" stroke="#3b2416" stroke-width="3"/>
			<ellipse cx="60" cy="108" rx="27" ry="25" fill="url(#fur)" stroke="#3b2416" stroke-width="3"/>
			<ellipse cx="60" cy="113" rx="17" ry="15" fill="#f3cf9b"/>
			<circle cx="24" cy="54" r="13" fill="#8a5a33" stroke="#3b2416" stroke-width="3"/><circle cx="24" cy="54" r="7.5" fill="#f0b98e"/>
			<circle cx="96" cy="54" r="13" fill="#8a5a33" stroke="#3b2416" stroke-width="3"/><circle cx="96" cy="54" r="7.5" fill="#f0b98e"/>
			<circle cx="60" cy="52" r="34" fill="url(#fur)" stroke="#3b2416" stroke-width="3"/>
			<path d="M38 60A15 15 0 1 1 60 40A15 15 0 1 1 82 60Q84 83 60 83Q36 83 38 60Z" fill="#f3cf9b" stroke="#3b2416" stroke-width="2.4"/>
			<ellipse cx="39" cy="66" rx="6" ry="4" fill="#ff8f8f" opacity=".45"/><ellipse cx="81" cy="66" rx="6" ry="4" fill="#ff8f8f" opacity=".45"/>
			<path d="M42 54A6 6 0 0 1 54 54M66 54A6 6 0 0 1 78 54" fill="none" stroke="#3b2416" stroke-width="3" stroke-linecap="round"/>
			<circle cx="56.5" cy="63" r="1.8" fill="#3b2416"/><circle cx="63.5" cy="63" r="1.8" fill="#3b2416"/>
			<path d="M49 69Q60 86 71 69Z" fill="#7a2a1f" stroke="#3b2416" stroke-width="2.6" stroke-linejoin="round"/>
		</g>
	</defs>
	<rect width="800" height="600" fill="url(#bg)"/>
	<g filter="url(#blur)" opacity=".55">
		<circle cx="640" cy="120" r="150" fill="#fff6b0"/>
		<circle cx="120" cy="520" r="160" fill="#4cc35a"/>
	</g>
	<!-- jungle leaves framing the top -->
	<g fill="#2fa84f"><use href="#leaf" transform="translate(-30 40) rotate(-10) scale(1.6)"/><use href="#leaf" transform="translate(40 -20) rotate(25) scale(1.3)"/></g>
	<g fill="#46c463"><use href="#leaf" transform="translate(830 60) rotate(190) scale(1.6)"/><use href="#leaf" transform="translate(770 -20) rotate(150) scale(1.2)"/></g>
	<!-- a path across the clearing -->
	<path d="M-20 520Q300 430 820 500" fill="none" stroke="#d9b46f" stroke-width="96" stroke-linecap="round"/>
	<path d="M-20 520Q300 430 820 500" fill="none" stroke="#f2d59b" stroke-width="80" stroke-linecap="round"/>
	<!-- the basket -->
	<g transform="translate(560 300)">
		<ellipse cx="60" cy="178" rx="76" ry="14" fill="#000" opacity=".15"/>
		<path d="M-6 70L14 168Q60 182 106 168L126 70Z" fill="#c48a52" stroke="#3b2416" stroke-width="4" stroke-linejoin="round"/>
		<rect x="2" y="104" width="116" height="20" fill="#ff5d73" stroke="#3b2416" stroke-width="3"/>
		<path d="M10 140Q60 152 112 140" fill="none" stroke="#8a5a33" stroke-width="4"/>
		<g transform="translate(30 60) rotate(-20) scale(1.3)"><use href="#banana"/></g>
		<g transform="translate(62 50) rotate(10) scale(1.3)"><use href="#banana"/></g>
		<g transform="translate(92 62) rotate(-35) scale(1.3)"><use href="#banana"/></g>
		<ellipse cx="60" cy="70" rx="66" ry="17" fill="#d9a066" stroke="#3b2416" stroke-width="4"/>
		<ellipse cx="60" cy="70" rx="54" ry="10" fill="#6b4423"/>
	</g>
	<!-- the sneaky monkey (blue cap) with a banana tower on its head -->
	<g transform="translate(300 170) scale(2.3)">
		<use href="#monkey"/>
		<path d="M37 86Q60 97 83 86L80 94Q60 104 40 94Z" fill="#1fa8ff" stroke="#3b2416" stroke-width="2.6" stroke-linejoin="round"/>
		<path d="M35 32A25 25 0 0 1 85 32Z" fill="#1fa8ff" stroke="#3b2416" stroke-width="2.6"/>
		<ellipse cx="80" cy="31" rx="17" ry="5" fill="#1580c4" stroke="#3b2416" stroke-width="2.6"/>
		<g transform="translate(56 6) rotate(-12) scale(.6)"><use href="#banana"/></g>
		<g transform="translate(64 -3) rotate(14) scale(.6)"><use href="#banana"/></g>
		<g transform="translate(57 -12) rotate(-10) scale(.6)"><use href="#banana"/></g>
	</g>
	<!-- the other monkey (pink bow) slipping on a peel -->
	<g transform="translate(70 290) rotate(-24 120 140) scale(1.9)">
		<use href="#monkey"/>
		<path d="M37 86Q60 97 83 86L80 94Q60 104 40 94Z" fill="#ff5d73" stroke="#3b2416" stroke-width="2.6" stroke-linejoin="round"/>
		<g transform="translate(82 24) rotate(20)"><path d="M0 0L-15 -9Q-19 0 -15 9Z M0 0L15 -9Q19 0 15 9Z" fill="#ff5d73" stroke="#3b2416" stroke-width="2.4" stroke-linejoin="round"/><circle r="4.5" fill="#d9404f" stroke="#3b2416" stroke-width="2.4"/></g>
	</g>
	<!-- dizzy stars + the peel -->
	<g fill="#ffe14d" stroke="#3b2416" stroke-width="3" stroke-linejoin="round">
		<path d="M120 270l8 16 18 2-13 12 4 18-17-9-16 9 3-18-13-12 18-2z"/>
		<path d="M220 240l6 12 13 1-9 9 3 13-13-7-12 7 3-13-10-9 14-1z"/>
	</g>
	<g transform="translate(250 530)">
		<path d="M-8 -6Q-40 0 -36 22Q-22 18 -4 4Z M8 -6Q40 0 36 22Q22 18 4 4Z M-6 0Q0 34 6 0Z" fill="#ffd84a" stroke="#3b2416" stroke-width="3.5" stroke-linejoin="round"/>
		<ellipse cx="0" cy="-6" rx="13" ry="8" fill="#ffd84a" stroke="#3b2416" stroke-width="3.5"/>
		<rect x="-4" y="-26" width="8" height="16" rx="3" fill="#7a5230" stroke="#3b2416" stroke-width="3"/>
	</g>
</svg>
