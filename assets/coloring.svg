<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#ffd59a"/></linearGradient>
		<linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ab0a0"/><stop offset="1" stop-color="#2f8a3c"/></linearGradient>
	</defs>
	<rect width="800" height="600" fill="url(#bg)"/>
	<circle cx="700" cy="90" r="130" fill="#fff" opacity="0.35"/>
	<circle cx="80" cy="540" r="140" fill="#fff" opacity="0.3"/>
	<!-- book -->
	<g filter="drop-shadow(0 16px 16px rgba(0,0,0,.2))">
		<path d="M90 140 Q260 110 400 160 Q540 110 710 140 L710 480 Q540 455 400 500 Q260 455 90 480 Z" fill="url(#cover)"/>
		<path d="M110 150 Q260 125 395 170 L395 480 Q260 445 110 465 Z" fill="#fff"/>
		<path d="M405 170 Q540 125 690 150 L690 465 Q540 445 405 480 Z" fill="#fff"/>
		<path d="M400 165 V495" stroke="#d9d2c0" stroke-width="6"/>
	</g>
	<!-- left page: flower outline -->
	<g fill="#fff" stroke="#2b2b2b" stroke-width="6" stroke-linejoin="round">
		<path d="M250 330 Q245 390 255 440" fill="none"/>
		<ellipse cx="250" cy="250" rx="28" ry="45"/>
		<ellipse cx="250" cy="250" rx="28" ry="45" transform="rotate(72 250 300)"/>
		<ellipse cx="250" cy="250" rx="28" ry="45" transform="rotate(144 250 300)"/>
		<ellipse cx="250" cy="250" rx="28" ry="45" transform="rotate(216 250 300)"/>
		<ellipse cx="250" cy="250" rx="28" ry="45" transform="rotate(288 250 300)"/>
		<circle cx="250" cy="300" r="32"/>
		<path d="M253 395 Q205 360 185 395 Q215 420 253 395 Z"/>
	</g>
	<!-- right page: the same flower, colored -->
	<g stroke="#2b2b2b" stroke-width="6" stroke-linejoin="round">
		<path d="M550 330 Q545 390 555 440" fill="none" stroke="#2f8a3c" stroke-width="10"/>
		<ellipse cx="550" cy="250" rx="28" ry="45" fill="#ff5fa2"/>
		<ellipse cx="550" cy="250" rx="28" ry="45" transform="rotate(72 550 300)" fill="#9b5cff"/>
		<ellipse cx="550" cy="250" rx="28" ry="45" transform="rotate(144 550 300)" fill="#3bb2ff"/>
		<ellipse cx="550" cy="250" rx="28" ry="45" transform="rotate(216 550 300)" fill="#3ddc84"/>
		<ellipse cx="550" cy="250" rx="28" ry="45" transform="rotate(288 550 300)" fill="#ff8c42"/>
		<circle cx="550" cy="300" r="32" fill="#ffd23f"/>
		<path d="M553 395 Q505 360 485 395 Q515 420 553 395 Z" fill="#3ddc84"/>
	</g>
	<!-- crayons -->
	<g filter="drop-shadow(0 8px 8px rgba(0,0,0,.18))">
		<g transform="rotate(-25 160 545)"><rect x="80" y="528" width="140" height="34" rx="7" fill="#ef4444"/><polygon points="220,528 256,545 220,562" fill="#ef4444"/><rect x="108" y="528" width="18" height="34" fill="#fff" opacity="0.5"/></g>
		<g transform="rotate(-8 330 560)"><rect x="250" y="545" width="140" height="34" rx="7" fill="#f5c242"/><polygon points="390,545 426,562 390,579" fill="#f5c242"/><rect x="278" y="545" width="18" height="34" fill="#fff" opacity="0.5"/></g>
		<g transform="rotate(10 560 560)"><rect x="480" y="545" width="140" height="34" rx="7" fill="#3bb2ff"/><polygon points="620,545 656,562 620,579" fill="#3bb2ff"/><rect x="508" y="545" width="18" height="34" fill="#fff" opacity="0.5"/></g>
	</g>
	<!-- paint splashes & sparkles -->
	<circle cx="720" cy="520" r="34" fill="#9b5cff"/><circle cx="765" cy="490" r="14" fill="#9b5cff"/>
	<circle cx="70" cy="90" r="30" fill="#ff5fa2"/><circle cx="110" cy="60" r="12" fill="#ff5fa2"/>
	<path d="M640 70 L650 45 L660 70 L685 80 L660 90 L650 115 L640 90 L615 80 Z" fill="#fff"/>
	<path d="M170 60 L177 42 L184 60 L202 67 L184 74 L177 92 L170 74 L152 67 Z" fill="#fff"/>
</svg>
