<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#f3efff">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>أين الكرة؟ · Find the Ball</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎩</text></svg>">
	<link rel="stylesheet" href="cup-ball.css">
</head>
<body>
	<!-- soft moving color blobs behind everything -->
	<div class="bg" aria-hidden="true">
		<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
		<span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span>
	</div>

	<header class="topbar">
		<button class="round-btn" id="homeBtn" type="button" aria-label="Home">🏠</button>
		<div class="level-chip hidden" id="levelChip"></div>
		<div class="stars hidden" id="stars" aria-label="Stars"></div>
		<div class="scoreboard hidden" id="scoreboard" aria-label="Score"></div>
		<span class="spacer"></span>
		<button class="chest-btn" id="chestBtn" type="button"><span class="chest-ico">🎁</span><b id="chestCount">0</b></button>
		<button class="round-btn" id="langBtn" type="button" aria-label="Language">🌐</button>
		<button class="round-btn" id="musicBtn" type="button" aria-label="Music">🎵</button>
		<button class="round-btn" id="soundBtn" type="button" aria-label="Sound">🔊</button>
	</header>

	<!-- ============ MENU: pick easy / medium / hard ============ -->
	<main class="screen active" id="menu">
		<div class="title-wrap">
			<div class="mascot"><span class="hat">🎩</span><span class="mini-ball"></span></div>
			<h1 class="title" data-t="title"></h1>
			<p class="subtitle" data-t="subtitle"></p>
		</div>
		<!-- one player, or play together (2-4 players take turns on the same device) -->
		<div class="mode-switch" id="modeSwitch">
			<button class="mode" type="button" data-mode="solo"><span>👤</span><span data-t="solo"></span></button>
			<button class="mode" type="button" data-mode="multi"><span>👥</span><span data-t="multi"></span></button>
		</div>
		<div class="multi-setup hidden" id="multiSetup">
			<section id="players" aria-label="Players"></section>
			<div class="setup-row"><span class="setup-label" data-t="turnsLabel"></span><div class="choices" id="turnChoices"></div></div>
		</div>
		<div class="levels" id="levels"></div>
		<button class="pill-btn prizes-btn" id="menuPrizesBtn" type="button"><span>🎁</span><span data-t="myPrizes"></span><b id="menuPrizeCount"></b></button>
	</main>

	<!-- ============ GAME ============ -->
	<main class="screen" id="game">
		<div id="partyBoard" class="hidden" aria-label="Players"></div>
		<div class="bubble" id="bubble"><span id="bubbleText"></span></div>
		<section class="stage" id="stage" aria-label="Cups">
			<div class="table"></div>
			<div class="ball" id="ball" aria-hidden="true"></div>
		</section>
		<div class="controls">
			<button class="play-btn" id="playBtn" type="button"><span class="play-ico">▶</span><span class="play-who" id="playWho"></span><span data-t="play"></span></button>
			<!-- play together: every player drags their picture onto a cup -->
			<div class="dock hidden" id="dock"></div>
		</div>
	</main>

	<!-- ============ PRIZE: the gift opens ============ -->
	<div class="overlay hidden" id="prizeOverlay" role="dialog" aria-modal="true">
		<div class="prize-card">
			<div class="rays"></div>
			<p class="prize-head" id="prizeHead"></p>
			<div class="prize-stage">
				<button class="gift" id="gift" type="button" aria-label="Open">🎁</button>
				<div class="prize" id="prizeEmoji"></div>
				<span class="new-tag hidden" id="newTag" data-t="new"></span>
			</div>
			<p class="prize-name" id="prizeName"></p>
			<button class="pill-btn collect-btn" id="collectBtn" type="button" data-t="collect"></button>
		</div>
	</div>

	<!-- ============ SUPER PRIZE: 5 stars = a golden trophy ============ -->
	<div class="overlay hidden" id="superOverlay" role="dialog" aria-modal="true">
		<div class="prize-card super">
			<div class="rays gold"></div>
			<p class="prize-head" data-t="champion"></p>
			<div class="prize-stage"><div class="prize trophy">🏆</div></div>
			<p class="prize-name" data-t="fiveStars"></p>
			<button class="pill-btn collect-btn" id="superBtn" type="button" data-t="hooray"></button>
		</div>
	</div>

	<!-- ============ PLAY TOGETHER: results ============ -->
	<div class="overlay hidden" id="resultOverlay" role="dialog" aria-modal="true">
		<div class="prize-card result-card">
			<div class="rays gold"></div>
			<p class="prize-head" data-t="results"></p>
			<div class="podium" id="podium"></div>
			<div class="result-actions">
				<button class="pill-btn collect-btn" id="winnerGiftBtn" type="button"><span>🎁</span><span data-t="winnerGift"></span></button>
				<div class="result-row">
					<button class="pill-btn" id="againBtn" type="button"><span>🔁</span><span data-t="again"></span></button>
					<button class="pill-btn" id="resultMenuBtn" type="button"><span>🏠</span><span data-t="menu"></span></button>
				</div>
			</div>
		</div>
	</div>

	<!-- ============ MY PRIZES ============ -->
	<div class="overlay hidden" id="shelfOverlay" role="dialog" aria-modal="true">
		<div class="shelf-card">
			<header class="shelf-head">
				<h2><span>🎁</span> <span data-t="myPrizes"></span></h2>
				<span class="shelf-count" id="shelfCount"></span>
				<button class="round-btn" id="shelfClose" type="button" aria-label="Close">✖</button>
			</header>
			<div class="trophies" id="trophies"></div>
			<div class="shelf" id="shelf"></div>
		</div>
	</div>

	<script src="../assets/vendor/gsap.min.js"></script>
	<script src="../assets/vendor/confetti.js"></script>
	<script src="../assets/players/players.js"></script>
	<script src="words.js"></script>
	<script src="audio/ar/index.js"></script>
	<script src="audio/en/index.js"></script>
	<script src="cup-ball.js"></script>
</body>
</html>
